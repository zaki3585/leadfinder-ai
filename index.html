<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumePro AI</title>
<style>
body{font-family:Arial;max-width:800px;margin:30px auto;padding:20px;background:#f5f5f5}
.box{background:white;padding:25px;border-radius:12px}
h1{text-align:center}
textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0}
textarea{height:150px}
button{padding:12px 18px;border:0;border-radius:6px;cursor:pointer}
#results{margin-top:20px}
.section{border:1px solid #ddd;padding:15px;margin-top:15px;border-radius:8px}
</style>
</head>
<body>

<div class="box">
<h1>ResumePro AI</h1>
<p>Create an AI-powered resume and cover letter.</p>

<input id="name" placeholder="Your name">

<textarea id="details" placeholder="Enter your skills, experience, education and other details..."></textarea>

<textarea id="job" placeholder="Paste the job description here..."></textarea>

<button onclick="generate()">Generate Resume</button>

<div id="results"></div>
</div>

<script>
async function generate(){
const name=document.getElementById("name").value.trim();
const details=document.getElementById("details").value.trim();
const job=document.getElementById("job").value.trim();
const results=document.getElementById("results");

if(!details||!job){
results.innerHTML="<p>Please enter your details and job description.</p>";
return;
}

results.innerHTML="<p>Generating...</p>";

try{
const response=await fetch("/generate-resume",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,details,job})
});

const data=await response.json();

if(!data.success){
results.innerHTML="<p>Error: "+data.error+"</p>";
return;
}

results.innerHTML=`
<div class="section">
<h2>Resume</h2>
<pre style="white-space:pre-wrap">${data.resume}</pre>
</div>
<div class="section">
<h2>Cover Letter</h2>
<pre style="white-space:pre-wrap">${data.coverLetter}</pre>
</div>
`;

}catch(error){
results.innerHTML="<p>Connection error: "+error.message+"</p>";
}
}
</script>

</body>
</html>
