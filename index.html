<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumePro AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
.container{max-width:900px;margin:auto;padding:25px}
h1{text-align:center;margin-bottom:5px}
.subtitle{text-align:center;color:#666;margin-bottom:25px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001;margin-bottom:20px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
textarea{min-height:120px;resize:vertical}
.generate{width:100%;padding:14px;border:0;border-radius:8px;background:#111;color:white;font-size:16px;font-weight:bold;margin-top:20px}
.generate:disabled{opacity:.6}
#status{text-align:center;display:none;margin:15px}
.results{display:none}
.resume{background:white;padding:35px;min-height:700px}
.cover{background:white;padding:25px;margin-top:20px}
.download{padding:12px 18px;border:0;border-radius:8px;background:#111;color:white;margin-bottom:15px}

/* MODERN */
.resume.modern{border-top:8px solid #2563eb}
.resume.modern h2{color:#2563eb}

/* PROFESSIONAL */
.resume.professional{border-left:8px solid #333}
.resume.professional h2{border-bottom:2px solid #333;padding-bottom:8px}

/* MINIMAL */
.resume.minimal{border:1px solid #ddd}
.resume.minimal h2{font-weight:normal;letter-spacing:2px}

/* CREATIVE */
.resume.creative{border-top:8px solid #9333ea;border-radius:12px}
.resume.creative h2{color:#9333ea}

/* EXECUTIVE */
.resume.executive{border-top:10px double #111}
.resume.executive h2{text-transform:uppercase;letter-spacing:1px}

/* PRINT */
@media print {
  body { background: white !important; }
  body > * { display: none !important; }
  .container { display: block !important; max-width: none !important; padding: 0 !important; }
  .card, #status, .subtitle, h1, .download { display: none !important; }
  #results { display: block !important; }
  .print-area { display: block !important; }
  .resume, .cover { display: block !important; box-shadow: none !important; border-radius: 0 !important; }
}
</style>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<div class="container">

<h1>ResumePro AI</h1>
<p class="subtitle">Professional resumes. Smarter job applications.</p>

<div class="card">
<label for="name">Full Name</label>
<input id="name" placeholder="Enter your name">

<label for="details">Skills, Experience & Education</label>
<textarea id="details" placeholder="Enter your skills, experience, education and other details"></textarea>

<label for="job">Job Description</label>
<textarea id="job" placeholder="Paste the job description here"></textarea>

<label for="template">Choose Resume Template</label>
<select id="template">
<option value="modern">Modern</option>
<option value="professional">Professional</option>
<option value="minimal">Minimal</option>
<option value="creative">Creative</option>
<option value="executive">Executive</option>
</select>

<button class="generate" id="generateBtn" onclick="generateResume()">
Create My Professional Resume
</button>

<div id="status">⏳ Creating your professional resume...</div>
</div>

<div id="results" class="results">

<button class="download" onclick="downloadPDF()">⬇ Download PDF</button>

<div id="printArea" class="print-area">

<div id="resume" class="resume modern"></div>

<div class="cover">
<h2>✉️ Tailored Cover Letter</h2>
<div id="coverLetter"></div>
</div>

</div>
</div>

</div>

<script>

async function generateResume(){

const name=document.getElementById("name").value.trim();
const details=document.getElementById("details").value.trim();
const job=document.getElementById("job").value.trim();
const template=document.getElementById("template").value;

const status=document.getElementById("status");
const results=document.getElementById("results");
const button=document.getElementById("generateBtn");

if(!details || !job){
alert("Please enter your skills/experience/education and job description.");
return;
}

status.style.display="block";
results.style.display="none";
button.disabled=true;

try{

const response=await fetch("/generate-resume",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name,
details,
job,
template
})
});

const data=await response.json();

if(!response.ok || !data.resume){
throw new Error(data.error || "Something went wrong");
}

const resume=document.getElementById("resume");

resume.innerHTML=formatResume(data.resume);

resume.className="resume "+template;

document.getElementById("coverLetter").textContent=
data.coverLetter || "";

results.style.display="block";

results.scrollIntoView({
behavior:"smooth"
});

}catch(e){

alert("Unable to generate resume: "+e.message);

}finally{

status.style.display="none";
button.disabled=false;

}

}

function formatResume(text){
  const sections=["PROFESSIONAL SUMMARY","AREAS OF EXPERTISE","PROFESSIONAL EXPERIENCE","EDUCATION","TOOLS & SKILLS","PROFESSIONAL CAPABILITIES"];
  let html="";
  const lines=text.split(/\r?\n/);
  let current="";
  for(const raw of lines){
    const line=raw.trim();
    if(!line) continue;
    const heading=sections.find(x=>line.toUpperCase().replace(/[:#*]/g,"").trim()===x);
    if(heading){
      current=heading;
      html+=`<section><h2>${heading}</h2>`;
      continue;
    }
    if(line.startsWith("-") || line.startsWith("•") || line.startsWith("*")){
      html+=`<li>${line.replace(/^[-•*]\s*/,"")}</li>`;
    }else{
      html+=`<p>${line}</p>`;
    }
  }
  html=html.replace(/(<li>.*?<\/li>)+/gs,m=>`<ul>${m}</ul>`);
  return html.replace(/<\/section>$/,"")+"</section>";
}

function downloadPDF(){

window.print();

}

</script>

</body>
</html>
