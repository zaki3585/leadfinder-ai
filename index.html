<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadFinder AI</title>
<style>
body{font-family:Arial;max-width:800px;margin:30px auto;padding:20px}
h1{text-align:center}
input{width:65%;padding:12px}
button{padding:12px 16px;cursor:pointer}
.lead{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:8px}
.copy{margin-top:8px}
.export{margin:15px 0}
</style>
</head>
<body>

<h1>LeadFinder AI</h1>

<input id="query" placeholder="e.g. Dentist in New York">
<button onclick="searchLeads()">Search</button>

<div class="export">
<button onclick="exportCSV()">Export CSV</button>
</div>

<div id="results"></div>

<script>
async function searchLeads(){
const query=document.getElementById("query").value.trim();
const results=document.getElementById("results");

if(!query){
results.innerHTML="<p>Please enter a search query.</p>";
return;
}

results.innerHTML="<p>Searching...</p>";

try{
const response=await fetch("http://localhost:3000/search-leads",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({query})
});

const data=await response.json();

if(!data.success){
results.innerHTML="<p>Error: "+data.error+"</p>";
return;
}

window.currentLeads=data.leads;

results.innerHTML=data.leads.map((lead,index)=>`
<div class="lead">
<h3>${lead.name||"Unknown"}</h3>
<p><b>Category:</b> ${lead.category||"N/A"}</p>
<p><b>Address:</b> ${lead.address||"N/A"}</p>
<p><b>Phone:</b> ${lead.phone||"N/A"}</p>
<p><b>Website:</b> ${lead.website||"N/A"}</p>
<button class="copy" onclick="copyLead(${index})">Copy Lead</button>
</div>
`).join("");

}catch(error){
results.innerHTML="<p>Connection error: "+error.message+"</p>";
}
}

function copyLead(index){
const lead=window.currentLeads[index];

const text=
"Name: "+(lead.name||"N/A")+"\n"+
"Category: "+(lead.category||"N/A")+"\n"+
"Address: "+(lead.address||"N/A")+"\n"+
"Phone: "+(lead.phone||"N/A")+"\n"+
"Website: "+(lead.website||"N/A");

navigator.clipboard.writeText(text).then(()=>{
alert("Lead copied!");
});
}

function exportCSV(){
const leads=window.currentLeads;

if(!leads||leads.length===0){
alert("Search leads first!");
return;
}

const header="Name,Category,Address,Phone,Website\n";

const rows=leads.map(lead=>{
return [
lead.name||"",
lead.category||"",
lead.address||"",
lead.phone||"",
lead.website||""
].map(value=>`"${String(value).replace(/"/g,'""')}"`).join(",");
}).join("\n");

const blob=new Blob([header+rows],{type:"text/csv"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="leadfinder-leads.csv";
a.click();

URL.revokeObjectURL(url);
}
</script>

</body>
</html>
